[package]
name = "bradian-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Distributed and federated analytical execution: coordinator, workers, exchange, reconciliation"

[dependencies]
bradian-core     = { workspace = true }
