[package]
name = "bradian-relational"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bradian persistent relational catalog, typed WAL-backed rows, disk B+tree and page cache"

[dependencies]
bradian-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
parking_lot = { workspace = true }
zstd = { workspace = true, features = ["zdict_builder"] }
blake3 = { workspace = true }
subtle = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ADR 0322 — Windows DACL inspection via Win32 API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = { workspace = true }
# ADR 0292 — vectorized SELECT path parity test. Dev-only until ADR 0293
# promotes the batch executor into the relational crate's production
# commit pipeline.
bradian-runtime = { workspace = true }
# ADR 0294 — commit-receipt → incremental aggregate parity test.
bradian-views   = { workspace = true }
# ADR 0296 — SQL logical plan tree parity test.
bradian-planner = { workspace = true }
