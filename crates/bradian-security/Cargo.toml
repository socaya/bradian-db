[package]
name = "bradian-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Authentication, authorization, audit, cache keying"

[dependencies]
bradian-core    = { workspace = true }
bradian-catalog = { workspace = true }
bradian-runtime = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
blake3      = { workspace = true }
chacha20poly1305 = { workspace = true }
parking_lot = { workspace = true }
tracing     = { workspace = true }
ahash       = { workspace = true }
# ADR 0323 — enterprise OIDC JWT verification (HS256).
hmac        = { workspace = true }
sha2        = { workspace = true }
base64      = { workspace = true }
subtle      = { workspace = true }
# ADR 0328 — enterprise OIDC JWT verification (RS256).
rsa         = { workspace = true }
# ADR 0341 — enterprise OIDC JWT verification (ES256).
p256        = { workspace = true }
# ADR 0329 — JWKS fetch for RS256 key rotation.
reqwest     = { workspace = true }
tokio       = { workspace = true }
# ADR 0332 — principal-from-cert mapping for mTLS peers.
x509-parser = { workspace = true }

[dev-dependencies]
proptest    = { workspace = true }
tempfile    = { workspace = true }
# ADR 0328 — generate a fixture RSA keypair for RS256 tests.
rand        = { workspace = true }
rand_chacha = { workspace = true }
# ADR 0332 — generate fixture mTLS client certs for tests.
rcgen       = { workspace = true }
