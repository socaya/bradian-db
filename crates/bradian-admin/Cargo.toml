[package]
name = "bradian-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Operator CLI + diagnostics"
default-run = "bradian-admin"

[[bin]]
name = "bradian-admin"
path = "src/main.rs"

[[bin]]
name = "bradian-db"
path = "src/bin/bradian-db.rs"

[dependencies]
bradian-relational = { path = "../bradian-relational" }
bradian-core    = { workspace = true }
bradian-catalog = { workspace = true, features = ["http"] }
bradian-storage = { workspace = true }
bradian-serving = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
humantime   = { workspace = true }
axum        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
