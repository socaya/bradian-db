[workspace]
resolver = "2"
members = [
    "crates/bradian-relational",
    "crates/bradian-core",
    "crates/bradian-catalog",
    "crates/bradian-storage",
    "crates/bradian-runtime",
    "crates/bradian-planner",
    "crates/bradian-ingest",
    "crates/bradian-views",
    "crates/bradian-dhis2",
    "crates/bradian-security",
    "crates/bradian-serving",
    "crates/bradian-admin",
    "crates/bradian-benchmark",
    "crates/bradian-distributed",
    "crates/bradian-sources",
    "tests/bradian-e2e",
]

[workspace.metadata.bradian]
product = "bradian-db"
display_name = "Bradian Database Systems"
specification = "docs/Bradian_Master_Architecture_SRS_v1.1.md"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["DER Engineering <socaya@users.noreply.github.com>"]
repository = "https://github.com/socaya/bradian-db"
readme = "README.md"

[workspace.dependencies]
# intra-workspace
bradian-core      = { path = "crates/bradian-core" }
bradian-catalog   = { path = "crates/bradian-catalog" }
bradian-storage   = { path = "crates/bradian-storage" }
bradian-runtime   = { path = "crates/bradian-runtime" }
bradian-planner   = { path = "crates/bradian-planner" }
bradian-ingest    = { path = "crates/bradian-ingest" }
bradian-views     = { path = "crates/bradian-views" }
bradian-dhis2     = { path = "crates/bradian-dhis2" }
bradian-distributed = { path = "crates/bradian-distributed" }
bradian-sources = { path = "crates/bradian-sources" }

bradian-security  = { path = "crates/bradian-security" }
bradian-serving   = { path = "crates/bradian-serving" }
bradian-admin     = { path = "crates/bradian-admin" }
bradian-relational = { path = "crates/bradian-relational" }

# external
serde            = { version = "1", features = ["derive", "rc"] }
serde_json       = "1"
bincode          = "1.3"
thiserror        = "1"
anyhow           = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
axum             = "0.7"
tower            = "0.5"
tower-http       = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
zstd             = { version = "0.13", default-features = false }
lz4_flex         = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
ahash            = { version = "0.8", features = ["serde"] }
rayon            = "1.10"
xxhash-rust      = { version = "0.8", features = ["xxh3"] }
crc32fast        = "1.4"
blake3           = "1.5"
subtle           = "2"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
proptest         = "1"
insta            = { version = "1", features = ["yaml"] }
criterion        = { version = "0.5", features = ["html_reports"] }
tempfile         = "3"
smallvec         = "1"
parking_lot      = "0.12"
once_cell        = "1"
bytes            = "1"
byteorder        = "1"
hex              = "0.4"
rand             = "0.8"
rand_chacha      = "0.3"
argon2           = { version = "0.5", features = ["std"] }
password-hash    = { version = "0.5", features = ["alloc"] }
# ADR 0323 — enterprise OIDC JWT verification (HS256).
hmac             = "0.12"
sha2             = "0.10"
base64           = "0.22"
# ADR 0328 — enterprise OIDC JWT verification (RS256).
rsa              = { version = "0.9", features = ["sha2", "pem"] }
# ADR 0341 — enterprise OIDC JWT verification (ES256).
p256             = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
rustls           = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
rustls-pemfile   = "2"
# ADR 0330 — TLS-wrapped wire protocol (bridges rustls to tokio TCP from ADR 0316).
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
# ADR 0332 — principal-from-cert mapping for mTLS peers.
x509-parser      = "0.16"
rcgen            = { version = "0.13", default-features = false, features = ["pem", "ring"] }
humantime        = "2"
clap             = { version = "4", features = ["derive"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
regex            = "1"
url              = "2"

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
debug     = false
strip     = "symbols"

[profile.bench]
opt-level = 3
lto       = "thin"
debug     = true

[profile.dev]
opt-level = 0
debug     = true
